<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart | Upper Life</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="watermark" aria-hidden="true">
    <img src="Images/IMG-20260901-WA0077.jpg" alt="Upper Life watermark" />
  </div>
  <!--Navigation bar-->
  <header class="site-header">
    <div class="topbar">
      <div class="brand">Upper Life</div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="Index.html">Home</a>
        <a href="About Us.html">About</a>
        <a href="Collections.html">Collections</a>
        <a href="Shop.html">Shop</a>
        <a href="Shopping Cart.html">Cart</a>
        <a href="Contact Us.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!--Page intro-->
    <div class="page-intro">
      <h1>Your cart</h1>
      <p>Your selected pieces are ready for checkout.</p>
    </div>

    <section class="cart-card" aria-label="Shopping cart details">
      <!--Cart items-->
      <div class="cart-item">
        <div class="cart-thumb">
          <img src="Images/IMG-20260901-WA0073.jpg" alt="Street Runner" />
        </div>
        <div class="item-meta">
          <h4>Street Runner</h4>
          <span>Size M • Colour Sand</span>
        </div>
        <strong>R 899</strong>
      </div>

      <div class="cart-item">
        <div class="cart-thumb">
          <img src="Images/IMG-20260901-WA0074.jpg" alt="Layer Jacket" />
        </div>
        <div class="item-meta">
          <h4>Layer Jacket</h4>
          <span>Size L • Colour Stone</span>
        </div>
        <strong>R 1,299</strong>
      </div>

      <div class="cart-summary">
        <!--Cart summary-->
        <p>Subtotal: 2 items</p>
        <strong>Total: R 2,198</strong>
      </div>

      <div class="button-row">
        <a class="button" href="Shop.html">Continue shopping</a>
      </div>
    </section>
  </main>
  <!--Footer-->
  <footer class="site-footer">
    © 2026 Upper Life Clothing Co
  </footer>
</body>
</html>
